name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build-time asset tools
        run: python -m pip install --disable-pip-version-check -r ports/rockbox/requirements-build.txt
      - name: Generate original asset pack
        run: python ports/rockbox/pack_assets.py
      - name: Verify generated levels
        run: |
          python tools/extract_levels.py
          git diff --exit-code -- src/levels.cpp
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test desktop and embedded core
        run: ctest --test-dir build -C Release --output-on-failure --output-junit results.xml
      - name: Render iPod preview
        run: |
          executable=build/rockbox_adapter_tests
          if [[ "${{ runner.os }}" == Windows ]]; then executable=build/Release/rockbox_adapter_tests.exe; fi
          "$executable" build/rockbox/bloons.dat build/rockbox/preview.ppm
          python -c "from PIL import Image; Image.open('build/rockbox/preview.ppm').save('build/rockbox/preview.png')"
      - name: Package Windows game
        if: runner.os == 'Windows'
        run: cmake --install build --config Release --prefix out/windows
      - name: Upload Windows game
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: bloons-windows-x64
          path: out/windows/
          if-no-files-found: error
          retention-days: 14
      - name: Upload iPod assets and preview (not a plugin binary)
        uses: actions/upload-artifact@v6
        with:
          name: rockbox-assets-${{ matrix.os }}
          path: |
            build/rockbox/bloons.dat
            build/rockbox/bloons.json
            build/rockbox/preview.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: checks-${{ matrix.os }}
          path: |
            build/results.xml
            build/Testing/Temporary/
            build/render/*.png
          if-no-files-found: ignore
          retention-days: 14
